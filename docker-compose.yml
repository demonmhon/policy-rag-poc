services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy-rag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-policy_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-policy_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: policy-rag-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    container_name: policy-ingestion-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-policy_rag}
      AI_PROVIDER: ${AI_PROVIDER:-mock} # mock | gemini | openai | claude
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm dev
    volumes:
      - ./sample-policies:/app/sample-policies:ro
      - ./services/ingestion-service/src:/app/src

  query-service:
    build:
      context: ./services/query-service
      dockerfile: Dockerfile
    container_name: policy-query-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-policy_rag}
      AI_PROVIDER: ${AI_PROVIDER:-mock} # mock | gemini | openai | claude
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-haiku-latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      MIN_SIMILARITY_THRESHOLD: ${MIN_SIMILARITY_THRESHOLD:-0.16}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm dev
    volumes:
      - ./services/query-service/src:/app/src

volumes:
  pgdata:
